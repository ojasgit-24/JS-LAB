<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration System</title>
    <!-- Include jQuery as required by the functionality -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #000;
            margin: 0;
            padding: 40px 20px;
            line-height: 1.4;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
        }
        header {
            border-bottom: 4px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        h1 {
            font-size: 28px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        .prn-display {
            font-size: 18px; /* Medium font */
            font-weight: bold;
        }
        #notification {
            background-color: #000;
            color: #fff;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-weight: bold;
            display: none;
        }
        .stats {
            display: flex;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            margin-bottom: 30px;
        }
        .stat-box {
            flex: 1;
            padding: 15px;
            border-right: 2px solid #000;
        }
        .stat-box:last-child {
            border-right: none;
        }
        .stat-label {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select, button {
            border: 2px solid #000;
            background: #fff;
            color: #000;
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            border-radius: 0;
            outline: none;
        }
        input:focus, select:focus {
            background: #f4f4f4;
        }
        .search-input {
            flex: 1;
            min-width: 200px;
        }
        button {
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
        }
        button:hover {
            background: #000;
            color: #fff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid #000;
        }
        th, td {
            border: 1px solid #000;
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background: #000;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border: 1px solid #000;
        }
        .status-registered {
            background-color: #000;
            color: #fff;
        }
        .status-pending {
            background-color: #fff;
            color: #000;
            border-style: dashed;
        }
        .status-cancelled {
            background-color: #e0e0e0;
            color: #666;
            border-color: #666;
            text-decoration: line-through;
        }
        .empty-row {
            text-align: center;
            padding: 30px !important;
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Event Registry</h1>
        <div class="prn-display">PRN:24070521224</div>
    </header>

    <div id="notification">Ready.</div>

    <div class="stats">
        <div class="stat-box">
            <span class="stat-label">Total</span>
            <span class="stat-value" id="statTotal">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Registered</span>
            <span class="stat-value" id="statRegistered">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Pending</span>
            <span class="stat-value" id="statPending">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Cancelled</span>
            <span class="stat-value" id="statCancelled">0</span>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Search by name or PRN...">
        <select id="statusFilter">
            <option value="All">All Statuses</option>
            <option value="Registered">Registered</option>
            <option value="Pending">Pending</option>
            <option value="Cancelled">Cancelled</option>
        </select>
        <button id="btnFetch">Load (Fetch API)</button>
        <button id="btnJquery">Load (jQuery)</button>
        <button id="btnClear">Reset</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>PRN</th>
                <th>Student Name</th>
                <th>Department</th>
                <th>Year</th>
                <th>Event</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr>
                <td colspan="7" class="empty-row">No records to display. Click a load button above.</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
// Inline JSON data simulating an external file
const recordsData = [
  { "prn": "PRN24001", "studentName": "Alex Johnson", "department": "Computer Science", "year": "TE", "eventName": "Hackathon 2026", "registrationStatus": "Registered" },
  { "prn": "PRN24002", "studentName": "Sam Smith", "department": "Information Tech", "year": "TE", "eventName": "WebDev Sprint", "registrationStatus": "Registered" },
  { "prn": "PRN24003", "studentName": "Jordan Lee", "department": "Data Science", "year": "BE", "eventName": "Cyber Workshop", "registrationStatus": "Pending" },
  { "prn": "PRN24004", "studentName": "Casey Brown", "department": "Computer Science", "year": "SE", "eventName": "Robotics Expo", "registrationStatus": "Registered" },
  { "prn": "PRN24005", "studentName": "Taylor Davis", "department": "Electronics", "year": "TE", "eventName": "Hackathon 2026", "registrationStatus": "Cancelled" },
  { "prn": "PRN24006", "studentName": "Morgan Miller", "department": "Mechanical", "year": "FE", "eventName": "CAD Contest", "registrationStatus": "Pending" },
  { "prn": "PRN24007", "studentName": "Jamie Wilson", "department": "Information Tech", "year": "BE", "eventName": "WebDev Sprint", "registrationStatus": "Registered" },
  { "prn": "PRN24008", "studentName": "Drew Moore", "department": "Computer Science", "year": "SE", "eventName": "Tech Quiz", "registrationStatus": "Cancelled" }
];

// Create a Blob URL to simulate an external JSON endpoint for Fetch & jQuery to use
const blob = new Blob([JSON.stringify(recordsData)], { type: 'application/json' });
const DATA_URL = URL.createObjectURL(blob);

let allStudents = [];

function notify(message) {
    const notif = document.getElementById('notification');
    notif.textContent = message;
    notif.style.display = 'block';
    setTimeout(() => { notif.style.display = 'none'; }, 3500);
}

function updateStats(list) {
    document.getElementById('statTotal').textContent = list.length;
    document.getElementById('statRegistered').textContent = list.filter(s => s.registrationStatus === 'Registered').length;
    document.getElementById('statPending').textContent = list.filter(s => s.registrationStatus === 'Pending').length;
    document.getElementById('statCancelled').textContent = list.filter(s => s.registrationStatus === 'Cancelled').length;
}

function renderTable(list) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    
    if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-row">No matching records found.</td></tr>';
        return;
    }
    
    list.forEach((student, index) => {
        const tr = document.createElement('tr');
        const statusClass = 'status-' + student.registrationStatus.toLowerCase();
        
        tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${student.prn}</strong></td>
            <td>${student.studentName}</td>
            <td>${student.department}</td>
            <td>${student.year}</td>
            <td>${student.eventName}</td>
            <td><span class="status-badge ${statusClass}">${student.registrationStatus}</span></td>
        `;
        tbody.appendChild(tr);
    });
}

function applyFilters() {
    const term = document.getElementById('searchInput').value.toLowerCase().trim();
    const status = document.getElementById('statusFilter').value;
    
    const filtered = allStudents.filter(student => {
        const nameMatch = student.studentName.toLowerCase().includes(term);
        const prnMatch = student.prn.toLowerCase().includes(term);
        const searchMatch = term === '' || nameMatch || prnMatch;
        const statusMatch = status === 'All' || student.registrationStatus === status;
        
        return searchMatch && statusMatch;
    });
    
    renderTable(filtered);
}

// 1. Fetch API
document.getElementById('btnFetch').addEventListener('click', () => {
    fetch(DATA_URL)
        .then(response => response.json())
        .then(data => {
            allStudents = data;
            applyFilters();
            updateStats(allStudents);
            notify('Data successfully loaded using native Fetch API.');
        })
        .catch(error => {
            notify('Error loading data with Fetch API.');
        });
});

// 2. jQuery $.getJSON
document.getElementById('btnJquery').addEventListener('click', () => {
    $.getJSON(DATA_URL)
        .done(data => {
            allStudents = data;
            applyFilters();
            updateStats(allStudents);
            notify('Data successfully loaded using jQuery $.getJSON.');
        })
        .fail(() => {
            notify('Error loading data with jQuery.');
        });
});

// Event Listeners for Filters
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('statusFilter').addEventListener('change', applyFilters);
document.getElementById('btnClear').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    document.getElementById('statusFilter').value = 'All';
    applyFilters();
});

// Initial auto-load
document.getElementById('btnFetch').click();

</script>

</body>
</html>
